<html lang="zh-TW" class="font-mode-standard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳務查詢與核對系統</title>
    
    <!-- Google Fonts: Noto Sans TC & JetBrains Mono (確保帳務數字等寬專業顯示) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        
        /* 字體大小二段切換設定（預設標準 16px / 大字 19.5px） */
        html {
            transition: font-size 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        html.font-mode-standard { font-size: 16px; }
        html.font-mode-large { font-size: 19.5px; }

        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 0.85px, transparent 0.85px);
            background-size: 24px 24px;
            line-height: 1.6;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
            font-variant-numeric: tabular-nums;
        }
        .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        
        /* 專業載入動畫 */
        .spinner { border: 4px solid rgba(99, 102, 241, 0.15); width: 52px; height: 52px; border-radius: 50%; border-left-color: #4f46e5; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 隱藏捲軸但保留捲動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;

        const GOOGLE_SHEETS_URLS = {
            pettyCash: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=2045201045&single=true&output=csv",
            puzhuo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=385503720&single=true&output=csv",
            zhongyuan: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=568633814&single=true&output=csv",
            taiSui: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1409111845&single=true&output=csv",        
            lightUpper: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1353370878&single=true&output=csv",    
            lightLower: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1743080288&single=true&output=csv",    
            records: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=0&single=true&output=csv",
            eastTrip: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=43391721", 
            fujianTrip: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=691088006",
            donation: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=935792502", 
            member: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1548605444&single=true&output=csv", 
            guansheng: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1292456593&single=true&output=csv",
            wangmu: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1713222138&single=true&output=csv",
            buyinku: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1149465647&single=true&output=csv"
        };

        const fmtMoney = (num) => new Intl.NumberFormat('zh-TW').format(num);

        const getSortableDate = (dateStr) => {
            if (!dateStr) return Number.MAX_SAFE_INTEGER;
            let str = String(dateStr).trim().replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 65248));
            str = str.replace(/[.、\-年月]/g, '/').replace(/[日號]/g, '').replace(/\/+$/, '');
            let parts = str.split('/').filter(p => p.trim() !== ''); 
            if (parts.length === 0) return Number.MAX_SAFE_INTEGER;
            
            let y, m, d;
            const currentYear = new Date().getFullYear();

            if (parts.length >= 3) {
                y = parseInt(parts[0], 10); m = parseInt(parts[1], 10); d = parseInt(parts[2], 10);
            } else if (parts.length === 2) {
                let p0 = parseInt(parts[0], 10); let p1 = parseInt(parts[1], 10);
                if (p0 > 31) { y = p0; m = p1; d = 1; } else { y = currentYear; m = p0; d = p1; }
            } else if (parts.length === 1) {
                let p0 = parseInt(parts[0], 10);
                if (p0 > 31) { y = p0; m = 1; d = 1; } else { y = currentYear; m = p0; d = 1; }
            }
            if (y < 1911) y += 1911;
            if (isNaN(y) || isNaN(m) || isNaN(d)) return Number.MAX_SAFE_INTEGER;
            let dObj = new Date(y, m - 1, d);
            return isNaN(dObj.getTime()) ? Number.MAX_SAFE_INTEGER : dObj.getTime();
        };

        const formatDateObj = (timestamp) => {
            if (timestamp === Number.MAX_SAFE_INTEGER) return "無日期紀錄";
            const d = new Date(timestamp);
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };

        const splitCSVRow = (str) => {
            let row = [''], i = 0, inQuotes = false;
            for (let char of str) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) row[++i] = '';
                else row[i] += char;
            }
            return row.map(v => v.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
        };

        const extractPettyCash = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let dateKey = keys.find(k => k.includes('日期')) || keys[0];
            let incomeKey = keys.find(k => k.includes('收入') || k.includes('存入') || k.includes('進帳')) || keys[1];
            let expenseKey = keys.find(k => k.includes('支出') || k.includes('提出') || k.includes('花費')) || keys[2];
            let itemKey = keys.find(k => k.includes('項目') || k.includes('摘要') || k.includes('說明') || k.includes('事由')) || keys[3];

            return parsed.map((row, i) => {
                const rawDate = (row[dateKey] || '').trim();
                const incomeStr = String(row[incomeKey] || '').replace(/,/g, '').replace(/\$/g, '');
                const expenseStr = String(row[expenseKey] || '').replace(/,/g, '').replace(/\$/g, '');
                const income = parseInt(incomeStr, 10) || 0;
                const expense = parseInt(expenseStr, 10) || 0;
                const item = (row[itemKey] || '').trim();

                let yearMonth = "未知月份";
                let timestamp = getSortableDate(rawDate);
                
                if (timestamp !== Number.MAX_SAFE_INTEGER) {
                    const d = new Date(timestamp);
                    let rocYear = d.getFullYear() - 1911; 
                    let month = String(d.getMonth() + 1).padStart(2, '0');
                    yearMonth = `${rocYear}-${month}`;
                }

                return { id: i, date: rawDate, item, income, expense, yearMonth, timestamp };
            }).filter(r => r.income > 0 || r.expense > 0 || r.item !== '');
        };

        const extractPuzhuo = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            
            const paidSet = new Set();
            parsed.forEach(row => {
                const payer = row['_col_4'];
                if(payer && payer.trim() !== '' && !payer.includes('姓名')) {
                    paidSet.add(payer.trim());
                }
            });

            const registeredNames = new Set();

            const registeredList = parsed.map((row, i) => {
                const id = (row['_col_0'] || '').trim();
                const name1 = (row['_col_1'] || '').trim();
                const name2 = (row['_col_2'] || '').trim();
                const memo = (row['_col_3'] || '').trim();

                if (name1) registeredNames.add(name1);
                if (name2) registeredNames.add(name2);

                const isPaid = (name1 && paidSet.has(name1)) || (name2 && paidSet.has(name2));
                const isDeceased = i >= 149; 
                
                const isGongZhuo = memo.includes('公桌');
                const isZanZhuo = memo.includes('贊普');
                const isBuShiFang = memo.includes('不施方');
                const isShiFang = !isGongZhuo && !isZanZhuo && !isBuShiFang && !isDeceased;

                return {
                    id, name1, name2, memo, isPaid, 
                    isDeceased, isGongZhuo, isZanZhuo, isBuShiFang, isShiFang,
                    valid: (id !== '' || name1 !== '' || name2 !== ''),
                    isUnregistered: false
                };
            }).filter(r => r.valid && (r.name1 || r.name2));

            const unregisteredList = Array.from(paidSet).filter(name => !registeredNames.has(name)).map((name) => ({
                id: '-', name1: name, name2: '', memo: '有繳費但未登記',
                isPaid: true, isDeceased: false, isGongZhuo: false, isZanZhuo: false, isBuShiFang: false, isShiFang: false,
                valid: true, isUnregistered: true
            }));

            return [...registeredList, ...unregisteredList];
        };

        const extractTripData = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let idKey = keys.find(k => k.includes('序號') || k.includes('編號')) || keys[0];
            let regKey = keys.find(k => k.includes('登記') || k.includes('姓名')) || keys[1]; 
            let paidKey = keys.find(k => k.includes('繳費')) || keys[4]; 
            
            let amountKey = keys.find(k => k.includes('金額') || k.includes('費用'));
            if (!amountKey) {
                let pIdx = keys.indexOf(paidKey);
                if (pIdx !== -1 && pIdx + 1 < keys.length) amountKey = keys[pIdx + 1];
            }
            if(!regKey) return [];

            let paidMap = new Map();
            parsed.forEach(row => {
                const pName = row[paidKey];
                if(pName && pName.trim() !== '' && !pName.includes('姓名')) {
                    let amountStr = amountKey ? row[amountKey] : '';
                    const amount = parseInt(String(amountStr).replace(/,/g, '').replace(/\$/g, '').replace(/\D/g, ''), 10) || 0;
                    paidMap.set(pName.trim(), amount);
                }
            });

            const registeredNames = new Set();
            const registeredList = parsed.filter(row => row[regKey] && row[regKey].trim() !== '').map((row, i) => {
                const rawName = row[regKey].trim();
                let realName = rawName;
                let roomType = "";
                
                if (rawName.includes('_')) {
                    const parts = rawName.split('_');
                    realName = parts[0];
                    roomType = parts.slice(1).join('_');
                }
                registeredNames.add(realName);

                return {
                    id: (row[idKey] || '').trim() || (i + 1),
                    rawName: rawName,
                    name: realName, 
                    roomType: roomType,
                    isPaid: paidMap.has(realName),
                    paidAmount: paidMap.has(realName) ? paidMap.get(realName) : 0,
                    isUnregistered: false
                };
            });

            const unregisteredList = [];
            paidMap.forEach((amount, name) => {
                if (!registeredNames.has(name)) {
                    unregisteredList.push({
                        id: '-', rawName: name, name: name, roomType: '',
                        isPaid: true, paidAmount: amount, isUnregistered: true
                    });
                }
            });

            return [...registeredList, ...unregisteredList];
        };

        const extractDonations = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let itemKey = keys.find(k => k.includes('項目')) || keys[0];
            let nameKey = keys.find(k => k.includes('姓名') || k.includes('名單')) || keys[1];
            let amountKey = keys.find(k => k.includes('金額') || k.includes('元')) || keys[2];
            let dateKey = keys.find(k => k.includes('日期')) || keys[3]; 
            let memoKey = keys.find(k => !k.startsWith('_col_') && (k.includes('備註') || k.includes('物資')));

            return parsed.map((row, i) => {
                const cleanAmount = parseInt((String(row[amountKey]) || '0').replace(/,/g, '').replace(/\$/g, ''), 10) || 0;
                const memo = memoKey && row[memoKey] ? row[memoKey].trim() : (row['_col_4'] || '').trim();
                
                return {
                    id: i, 
                    item: (row[itemKey] || '').trim(), 
                    name: (row[nameKey] || '').trim(),
                    amount: cleanAmount, 
                    date: (row[dateKey] || row['_col_3'] || '').trim(),
                    memo: memo
                };
            }).filter(r => r.name || r.amount > 0 || r.memo);
        };

        const extractMember = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let nameKey = keys.find(k => k.includes('姓名') || k.includes('名單')) || keys[1];
            return parsed.map((row, i) => ({
                id: (row[keys[0]] || i + 1).toString().trim(),
                name: (row[nameKey] || '').trim()
            })).filter(r => r.name);
        };

        const extractBirthday = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let nameKey = keys.find(k => k.includes('姓名')) || keys[0];
            let sizeKey = keys.find(k => k.includes('大小') || k.includes('組')) || keys[1];
            let amountKey = keys.find(k => k.includes('金額')) || keys[2];

            return parsed.map((row, i) => {
                const cleanAmount = parseInt((row[amountKey] || '0').replace(/,/g, '').replace(/\$/g, ''), 10) || 0;
                return { id: i, name: (row[nameKey] || '').trim(), type: (row[sizeKey] || '').trim(), amount: cleanAmount };
            }).filter(r => r.name);
        };

        const extractBuyinku = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const regMap = new Map();
            const paidMap = new Map();

            parsed.forEach((row, index) => {
                const id = (row['_col_0'] || '').trim();
                const name = (row['_col_1'] || '').trim();
                const qtyStr = (row['_col_2'] || '').replace(/\D/g, '');
                const qty = qtyStr ? parseInt(qtyStr, 10) : 0;
                
                if (name && !name.includes('姓名')) { regMap.set(name, { id, qty }); }

                if (index >= 1) {
                    const paidName = (row['_col_4'] || '').trim();
                    const paidQtyStr = (row['_col_5'] || '').replace(/\D/g, '');
                    const paidQty = paidQtyStr ? parseInt(paidQtyStr, 10) : 0;
                    if (paidName && !paidName.includes('姓名')) { paidMap.set(paidName, paidQty); }
                }
            });

            const finalData = [];
            regMap.forEach((data, name) => {
                const hasPaid = paidMap.has(name);
                const paidQty = hasPaid ? paidMap.get(name) : 0;
                const isQtyMismatch = hasPaid && (paidQty !== data.qty);
                finalData.push({ id: data.id, name: name, regQty: data.qty, paidQty: paidQty, isPaid: hasPaid, isUnregistered: false, isAnomaly: isQtyMismatch });
            });

            paidMap.forEach((paidQty, name) => {
                if (!regMap.has(name)) {
                    finalData.push({ id: '-', name: name, regQty: 0, paidQty: paidQty, isPaid: true, isUnregistered: true, isAnomaly: true });
                }
            });
            return finalData;
        };

        const sortById = (a, b) => {
            if (!a.id || !b.id) return 0;
            const firstA = String(a.id)[0]; const firstB = String(b.id)[0];
            if (firstA !== firstB) return firstA.localeCompare(firstB);
            const secondA = String(a.id)[1]; const secondB = String(b.id)[1];
            if (secondA !== secondB) return secondA.localeCompare(secondB);
            const restA = parseInt(String(a.id).slice(2), 10);
            const restB = parseInt(String(b.id).slice(2), 10);
            return restA - restB;
        };

        const DEFAULT_PETTYCASH_DATA = [{ id: "1", date: "115/08/01", item: "測試零用金", income: 1000, expense: 0, yearMonth: "115-08", timestamp: 0 }];
        const DEFAULT_PUZHUO_DATA = [{ id: "1", name1: "測試資料", name2: "", memo: "", isPaid: false, isDeceased: false, isGongZhuo: false, isZanZhuo: false, isBuShiFang: false, isShiFang: true, isUnregistered: false }];
        const DEFAULT_RECORD_DATA = [ { group: "1", role: "宮生", name: "傅沛柔", date: "114年12月" } ];
        const DEFAULT_TAISUI_DATA = [{id:"1A1",n:"黃淑霞",r:1,p:1}];
        const DEFAULT_LIGHT_DATA = [{id:"1B10",n:"游宇閎",t:1,r:1,p:1}];
        const DEFAULT_TRIP_DATA = [ { id: 1, name: "測試資料", isPaid: true, paidAmount: 0, isUnregistered: false } ];
        const DEFAULT_DONATION_DATA = [{ id: 1, item: "白米", name: "測試善人", amount: 500, date: "2023/10/01", memo: "" }];
        const DEFAULT_MEMBER_DATA = [{ id: 1, name: "測試會員" }];
        const DEFAULT_BIRTHDAY_DATA = [{ id: 1, name: "測試信眾", type: "大組", amount: 1200 }];
        const DEFAULT_BUYINKU_DATA = [{ id: "1", name: "測試資料", regQty: 1, paidQty: 1, isPaid: true, isUnregistered: false, isAnomaly: false }];

        const Icons = {
            Calendar: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-6 h-6"}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className="w-7 h-7"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-emerald-600"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Scroll: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-6 h-6"}><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>,

            Star: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
            ChevronDown: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><polyline points="6 9 12 15 18 9"></polyline></svg>,
            ChevronUp: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><polyline points="18 15 12 9 6 15"></polyline></svg>,
            Archive: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-6 h-6"}><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>,
            Wallet: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-6 h-6"}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>,
            Ledger: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-6 h-6"}><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><line x1="8" y1="7" x2="16" y2="7"></line><line x1="8" y1="11" x2="16" y2="11"></line></svg>,
            FontSize: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
        };

        const TABS_CONFIG = [
            { id: 'puzhuo', name: '中元普桌' },
            { id: 'buyinku', name: '補陰庫' },
            { id: 'zhongyuan', name: '參香捐獻' },
            { id: 'donation', name: '宮慶捐獻' },
            { id: 'guansheng', name: '關聖帝君祝壽' },
            { id: 'wangmu', name: '王母娘娘祝壽' },
            { id: 'member', name: '帝君會員' },
            { id: 'east', name: '參香' },
            { id: 'fujian', name: '小琉球二日行' },
            { id: 'pettyCash', name: '零用金' },
            { id: 'records', name: '委員/宮生' },
            { id: 'taisui', name: '安太歲' },
            { id: 'light', name: '光明燈' }
        ];

        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);

            // --- 字體大小二段切換狀態（預設進入為 STANDARD 標準模式，支援切換 LARGE 大字模式） ---
            const [fontSizeMode, setFontSizeMode] = useState(() => {
                try {
                    const saved = localStorage.getItem('ledger_font_mode_v2');
                    return (saved === 'LARGE' || saved === 'STANDARD') ? saved : 'STANDARD';
                } catch (e) {
                    return 'STANDARD';
                }
            });

            useEffect(() => {
                const rootEl = document.documentElement;
                rootEl.classList.remove('font-mode-standard', 'font-mode-large');
                if (fontSizeMode === 'LARGE') {
                    rootEl.classList.add('font-mode-large');
                } else {
                    rootEl.classList.add('font-mode-standard');
                }
                try {
                    localStorage.setItem('ledger_font_mode_v2', fontSizeMode);
                } catch (e) {}
            }, [fontSizeMode]);
            
            const [visibleTabs, setVisibleTabs] = useState({
                pettyCash: true, puzhuo: true, records: true, taisui: true, light: true, east: true, 
                fujian: true, donation: true, zhongyuan: true, member: true, guansheng: true, wangmu: true, buyinku: true
            });

            const [updateDates, setUpdateDates] = useState({
                pettyCash: "", puzhuo: "", records: "", taisui: "", light: "", east: "", fujian: "", 
                donation: "", zhongyuan: "", member: "", guansheng: "", wangmu: "", buyinku: ""
            });
            
            const [PettyCashDataRaw, setPettyCashDataRaw] = useState([]);
            const [PuzhuoDataRaw, setPuzhuoDataRaw] = useState([]);
            const [RecordData, setRecordData] = useState([]);
            const [TaiSuiDataRaw, setTaiSuiDataRaw] = useState([]);
            const [LightDataRaw, setLightDataRaw] = useState([]);
            const [EastTripDataRaw, setEastTripDataRaw] = useState([]);
            const [FujianTripDataRaw, setFujianTripDataRaw] = useState([]);
            const [DonationDataRaw, setDonationDataRaw] = useState([]);
            const [ZhongyuanDataRaw, setZhongyuanDataRaw] = useState([]); 
            const [MemberDataRaw, setMemberDataRaw] = useState([]);
            const [GuanshengDataRaw, setGuanshengDataRaw] = useState([]);
            const [WangmuDataRaw, setWangmuDataRaw] = useState([]);
            const [BuyinkuDataRaw, setBuyinkuDataRaw] = useState([]);

            const [fetchErrors, setFetchErrors] = useState({ 
                pettyCash: false, puzhuo: false, east: false, fujian: false, donation: false, zhongyuan: false, member: false, guansheng: false, wangmu: false, buyinku: false 
            });

            const [activeTab, setActiveTab] = useState("puzhuo"); 
            const [searchTerm, setSearchTerm] = useState("");
            const [showSuggestions, setShowSuggestions] = useState(false);
            
            // --- 實際零用金 雲端儲存區 (方案B) ---
            const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw70w84np4_Ti7cHJcz_h-TKMUqvpZ4_NrWtmSChe1kUvUTGavnPXAQXdXet4Om3Gk/exec"; 
            
            const [actualCash1, setActualCash1] = useState("");
            const [actualCash2, setActualCash2] = useState("");
            const [isSavingCash, setIsSavingCash] = useState(false);
            const [toastMsg, setToastMsg] = useState("");

            useEffect(() => {
                const fetchGasData = async () => {
                    try {
                        const res = await fetch(`${GAS_API_URL}?action=load`, {
                            method: 'GET',
                            headers: { 'Accept': 'application/json' }
                        });
                        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                        const data = await res.json();
                        if(data.cash1 !== undefined && data.cash1 !== "") setActualCash1(data.cash1);
                        if(data.cash2 !== undefined && data.cash2 !== "") setActualCash2(data.cash2);
                    } catch (err) {
                        console.warn("雲端讀取警告 (可能是尚未部署完全或 CORS 阻擋):", err.message);
                    }
                };
                fetchGasData();
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2500);
            };

            const handleFontChange = (mode, label) => {
                setFontSizeMode(mode);
                showToast(`🔍 已切換為「${label}」顯示模式`);
            };

            const handleCash1Change = (e) => setActualCash1(e.target.value);
            const handleCash2Change = (e) => setActualCash2(e.target.value);
            const actualCashTotal = (parseFloat(actualCash1) || 0) + (parseFloat(actualCash2) || 0);

            const handleSaveToCloud = async () => {
                if (GAS_API_URL.includes("請將此處替換為")) {
                    showToast("請先在程式碼中設定您的 GAS API 網址！");
                    return;
                }
                setIsSavingCash(true);
                try {
                    await fetch(`${GAS_API_URL}?action=save&cash1=${actualCash1}&cash2=${actualCash2}`, {
                        method: 'GET',
                        mode: 'no-cors'
                    });
                    showToast("✅ 雲端儲存請求已送出！");
                } catch(err) {
                    console.warn("儲存失敗:", err.message);
                    showToast("❌ 儲存失敗，請確認 API 網址或網路狀態。");
                }
                setIsSavingCash(false);
            };

            // Filters
            const [pettyCashMonth, setPettyCashMonth] = useState("");
            const [pettyCashTypeFilter, setPettyCashTypeFilter] = useState("ALL");
            const [puzhuoFilter, setPuzhuoFilter] = useState("ALL_TOTAL");
            const [filterRole, setFilterRole] = useState("ALL"); 
            const [lightFilterType, setLightFilterType] = useState("ALL");
            const [taiSuiFilterType, setTaiSuiFilterType] = useState("ALL");
            const [eastTripFilter, setEastTripFilter] = useState("ALL");
            const [fujianTripFilter, setFujianTripFilter] = useState("ALL");
            const [buyinkuFilter, setBuyinkuFilter] = useState("ALL");
            
            const [donationViewMode, setDonationViewMode] = useState("DONATION"); 
            const [donationFilterItem, setDonationFilterItem] = useState("ALL");
            const [expandedDonationNames, setExpandedDonationNames] = useState(new Set()); 
            const [donationStartDate, setDonationStartDate] = useState(""); 
            
            const [zhongyuanViewMode, setZhongyuanViewMode] = useState("DONATION"); 
            const [zhongyuanFilterItem, setZhongyuanFilterItem] = useState("ALL");
            const [expandedZhongyuanNames, setExpandedZhongyuanNames] = useState(new Set()); 
            const [zhongyuanStartDate, setZhongyuanStartDate] = useState(""); 
            
            const [birthdayFilter, setBirthdayFilter] = useState("ALL"); 
            
            // 密碼鎖定狀態（共用給「零用金」與「委員/宮生」）
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [inputPassword, setInputPassword] = useState("");
            const [loginError, setLoginError] = useState(false);

            const checkStatus = (row, ...keywords) => {
                let val = "";
                for (let k of keywords) {
                    if (row[k] !== undefined && row[k] !== '') { val = String(row[k]).trim(); break; }
                }
                if (!val) {
                    const rowKeys = Object.keys(row);
                    for (let key of rowKeys) {
                        for (let k of keywords) {
                            if (key.includes(k) && row[key] !== undefined && row[key] !== '') { val = String(row[key]).trim(); break; }
                        }
                        if (val) break;
                    }
                }
                if (!val) return 0;
                const upperVal = val.toUpperCase();
                if (upperVal === '0' || upperVal === 'FALSE' || upperVal === '否' || upperVal === '無') return 0;
                return 1; 
            };

            const fetchGoogleSheetsData = useCallback(async () => {
                setIsRefreshing(true);
                const getFreshUrl = (url) => `${url}&t=${new Date().getTime()}`;
                const fetchOptions = { cache: 'no-store' };

                const fetchData = async (url, parser) => {
                    if (!url) return { data: [], date: "", error: false, isHidden: false };
                    try {
                        const res = await fetch(getFreshUrl(url), fetchOptions);
                        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                        const text = await res.text();
                        
                        if (text.trim().toLowerCase().startsWith('<!doctype html>')) {
                             return { data: [], date: "", error: true, isHidden: false };
                        }

                        const firstLineEnd = text.indexOf('\n');
                        const firstLine = firstLineEnd !== -1 ? text.substring(0, firstLineEnd).trim() : text.trim();
                        const cleanFirstLine = firstLine.replace(/^\uFEFF/, '');
                        const headersRaw = splitCSVRow(cleanFirstLine);
                        const isHidden = headersRaw.length > 7 && headersRaw[7].includes('隱藏');

                        let extractedDate = "";
                        if (headersRaw.length > 5 && headersRaw[5].includes('更新')) {
                            extractedDate = headersRaw[5].replace(/更新日?[:：\s]?/g, '').trim();
                        } else {
                            const found = headersRaw.find(h => h.includes('更新日'));
                            if (found) extractedDate = found.replace(/更新日?[:：\s]?/g, '').trim();
                        }

                        if (isHidden) {
                            return { data: [], date: extractedDate, error: false, isHidden: true };
                        }

                        const cleanText = text.replace(/^\uFEFF/, '');
                        
                        const lines = cleanText.split(/\r?\n/)
                            .map(l => l.trim())
                            .filter(l => {
                                if (!l) return false;
                                return l.replace(/[,"]/g, '').trim() !== '';
                            });
                            
                        if (lines.length <= 1) return { data: [], date: extractedDate, error: false, isHidden: false };

                        const parsed = lines.slice(1).map(line => {
                            const values = splitCSVRow(line);
                            return headersRaw.reduce((obj, header, i) => {
                                const cleanHeader = header.replace(/["'\s]+/g, '');
                                obj[cleanHeader] = values[i] || '';
                                obj[`_col_${i}`] = values[i] || ''; 
                                return obj;
                            }, {});
                        });

                        return { data: parser ? parser(parsed) : parsed, date: extractedDate, error: false, isHidden: false };
                    } catch (e) {
                        return { data: [], date: "", error: true, isHidden: false };
                    }
                };

                const [
                    resPettyCash,
                    resPuzhuo, resRecord, resTaiSui, resLightUpper, resLightLower,
                    resEast, resFujian, resDonation, resZhongyuan, resMember,
                    resGuansheng, resWangmu, resBuyinku
                ] = await Promise.all([
                    fetchData(GOOGLE_SHEETS_URLS.pettyCash, extractPettyCash),
                    fetchData(GOOGLE_SHEETS_URLS.puzhuo, extractPuzhuo),
                    fetchData(GOOGLE_SHEETS_URLS.records, parsed => parsed.map(row => ({
                        group: row['組別'] || '', role: row['身份'] || '', name: row['姓名'] || '', date: row['繳交至'] || ''
                    })).filter(r => r.name)),
                    fetchData(GOOGLE_SHEETS_URLS.taiSui, parsed => parsed.map(row => ({
                        id: row['編號'] || '', n: row['姓名'] || '', 
                        r: checkStatus(row, '太歲登記', '登記', '安奉', '太歲'), 
                        p: checkStatus(row, '太歲繳費', '繳費', '付款', '金額')
                    })).filter(r => r.n)),
                    fetchData(GOOGLE_SHEETS_URLS.lightUpper, parsed => parsed.map(row => ({
                        id: row['編號'] || '', n: row['姓名'] || '', t: 1,
                        r: checkStatus(row, '光明燈上登記', '上層登記', '登記', '安奉', '光明燈'), 
                        p: checkStatus(row, '光明燈上繳費', '上層繳費', '繳費', '付款', '金額')
                    })).filter(r => r.n)),
                    fetchData(GOOGLE_SHEETS_URLS.lightLower, parsed => parsed.map(row => ({
                        id: row['編號'] || '', n: row['姓名'] || '', t: 2,
                        r: checkStatus(row, '光明燈下登記', '下層登記', '登記', '安奉', '光明燈'), 
                        p: checkStatus(row, '光明燈下繳費', '下層繳費', '繳費', '付款', '金額')
                    })).filter(r => r.n)),
                    fetchData(GOOGLE_SHEETS_URLS.eastTrip, extractTripData),
                    fetchData(GOOGLE_SHEETS_URLS.fujianTrip, extractTripData),
                    fetchData(GOOGLE_SHEETS_URLS.donation, extractDonations),
                    fetchData(GOOGLE_SHEETS_URLS.zhongyuan, extractDonations),
                    fetchData(GOOGLE_SHEETS_URLS.member, extractMember),
                    fetchData(GOOGLE_SHEETS_URLS.guansheng, extractBirthday),
                    fetchData(GOOGLE_SHEETS_URLS.wangmu, extractBirthday),
                    fetchData(GOOGLE_SHEETS_URLS.buyinku, extractBuyinku)
                ]);

                setUpdateDates({
                    pettyCash: resPettyCash.date,
                    puzhuo: resPuzhuo.date, records: resRecord.date, taisui: resTaiSui.date,
                    light: resLightUpper.date || resLightLower.date, east: resEast.date, fujian: resFujian.date,
                    donation: resDonation.date, zhongyuan: resZhongyuan.date, member: resMember.date, guansheng: resGuansheng.date,
                    wangmu: resWangmu.date, buyinku: resBuyinku.date
                });

                setVisibleTabs({
                    pettyCash: !resPettyCash.isHidden,
                    puzhuo: !resPuzhuo.isHidden, records: !resRecord.isHidden, taisui: !resTaiSui.isHidden,
                    light: !(resLightUpper.isHidden || resLightLower.isHidden), east: !resEast.isHidden,
                    fujian: !resFujian.isHidden, donation: !resDonation.isHidden, zhongyuan: !resZhongyuan.isHidden, member: !resMember.isHidden,
                    guansheng: !resGuansheng.isHidden, wangmu: !resWangmu.isHidden, buyinku: !resBuyinku.isHidden
                });

                setFetchErrors({
                    pettyCash: resPettyCash.error || resPettyCash.data.length === 0,
                    puzhuo: resPuzhuo.error || resPuzhuo.data.length === 0,
                    east: resEast.error || resEast.data.length === 0,
                    fujian: resFujian.error || resFujian.data.length === 0,
                    donation: resDonation.error || resDonation.data.length === 0,
                    zhongyuan: resZhongyuan.error || resZhongyuan.data.length === 0,
                    member: resMember.error || resMember.data.length === 0,
                    guansheng: resGuansheng.error || resGuansheng.data.length === 0,
                    wangmu: resWangmu.error || resWangmu.data.length === 0,
                    buyinku: resBuyinku.error || resBuyinku.data.length === 0
                });

                setPettyCashDataRaw(resPettyCash.data.length > 0 ? resPettyCash.data : [...DEFAULT_PETTYCASH_DATA]);
                setPuzhuoDataRaw(resPuzhuo.data.length > 0 ? resPuzhuo.data : [...DEFAULT_PUZHUO_DATA]);
                setRecordData(resRecord.data.length > 0 ? resRecord.data : [...DEFAULT_RECORD_DATA]);
                setTaiSuiDataRaw(resTaiSui.data.length > 0 ? resTaiSui.data : [...DEFAULT_TAISUI_DATA]);
                setLightDataRaw(resLightUpper.data.length > 0 || resLightLower.data.length > 0 ? [...resLightUpper.data, ...resLightLower.data] : [...DEFAULT_LIGHT_DATA]);
                setEastTripDataRaw(resEast.data.length > 0 ? resEast.data : [...DEFAULT_TRIP_DATA]);
                setFujianTripDataRaw(resFujian.data.length > 0 ? resFujian.data : [...DEFAULT_TRIP_DATA]);
                setDonationDataRaw(resDonation.data.length > 0 ? resDonation.data : [...DEFAULT_DONATION_DATA]);
                setZhongyuanDataRaw(resZhongyuan.data.length > 0 ? resZhongyuan.data : [...DEFAULT_DONATION_DATA]);
                setMemberDataRaw(resMember.data.length > 0 ? resMember.data : [...DEFAULT_MEMBER_DATA]);
                setGuanshengDataRaw(resGuansheng.data.length > 0 ? resGuansheng.data : [...DEFAULT_BIRTHDAY_DATA]);
                setWangmuDataRaw(resWangmu.data.length > 0 ? resWangmu.data : [...DEFAULT_BIRTHDAY_DATA]);
                setBuyinkuDataRaw(resBuyinku.data.length > 0 ? resBuyinku.data : [...DEFAULT_BUYINKU_DATA]);
                
                setIsLoading(false);
                setIsRefreshing(false);
            }, []);

            useEffect(() => { fetchGoogleSheetsData(); }, [fetchGoogleSheetsData]);

            const visibleTabsConfig = useMemo(() => {
                return TABS_CONFIG.filter(tab => visibleTabs[tab.id]);
            }, [visibleTabs]);

            useEffect(() => {
                if (!isLoading && !visibleTabs[activeTab]) {
                    if (visibleTabsConfig.length > 0) setActiveTab(visibleTabsConfig[0].id);
                    else setActiveTab(""); 
                }
            }, [visibleTabs, activeTab, isLoading, visibleTabsConfig]);

            // --- 零用金邏輯 ---
            const pettyCashUniqueMonths = useMemo(() => {
                const months = new Set();
                PettyCashDataRaw.forEach(item => {
                    if (item.yearMonth) months.add(item.yearMonth);
                });
                return Array.from(months).sort((a, b) => b.localeCompare(a)); 
            }, [PettyCashDataRaw]);

            useEffect(() => {
                if (pettyCashUniqueMonths.length > 0 && !pettyCashMonth) {
                    setPettyCashMonth(pettyCashUniqueMonths[0]);

                        <p className="text-base text-slate-400 mt-2 font-bold">請稍候，系統正在載入最新名單</p>
                    </div>
                );
            }

            const TabUpdateDate = ({ tabKey, leftContent }) => (
                <div className="flex flex-wrap justify-between items-center gap-2 mb-4 fade-in min-h-[44px]">
                    <div>{leftContent}</div>
                    <span className="text-base text-slate-700 font-extrabold bg-white border-2 border-slate-200 px-4 py-1.5 rounded-full flex items-center gap-2 shadow-sm ml-auto">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        最後更新：{updateDates[tabKey] || "未標示"}
                    </span>
                </div>
            );

            const ErrorBanner = ({ show }) => {
                if(!show) return null;
                return (
                    <div className="bg-rose-50 border-l-4 border-rose-600 p-5 mb-5 rounded-r-2xl shadow-sm flex items-start gap-3.5">
                        <div className="text-rose-600 mt-1"><Icons.Alert className="w-7 h-7" /></div>
                        <div>
                            <h3 className="text-rose-900 font-black text-lg">資料讀取失敗或已隱藏</h3>
                            <p className="text-rose-700 text-base mt-1 font-bold leading-relaxed">
                                系統無法連線、該試算表資料為空，或是 H1 欄位設定為隱藏。
                            </p>
                        </div>
                    </div>
                );
            };

            // 共用密碼鎖定元件（供「零用金」與「委員/宮生」分頁使用，密碼：296296）
            const renderPasswordLock = (title, desc) => (
                <div className="flex flex-col items-center justify-center py-8 px-2 fade-in">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-2 border-slate-200 text-center">
                        <div className="bg-indigo-50 border-2 border-indigo-100 p-5 rounded-2xl w-24 h-24 flex items-center justify-center mx-auto mb-5 text-indigo-600 shadow-inner">
                            <Icons.Lock />
                        </div>
                        <h3 className="text-2xl font-black text-slate-900 mb-2">{title}</h3>
                        <p className="text-slate-600 text-base font-bold mb-6">{desc}</p>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input 
                                type="password" 
                                inputMode="numeric"
                                value={inputPassword} 
                                onChange={(e) => setInputPassword(e.target.value)}
                                className={`w-full p-4 rounded-2xl border-2 text-center text-2xl font-mono-num font-black tracking-widest focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition-all ${loginError ? 'border-rose-500 shake bg-rose-50' : 'border-slate-300 focus:border-indigo-600 bg-slate-50 focus:bg-white'}`}
                                placeholder="請輸入密碼" 
                                autoFocus
                            />
                            {loginError && <p className="text-rose-600 text-base font-black">密碼驗證錯誤，請重新輸入</p>}
                            <button type="submit" className="w-full bg-indigo-600 text-white text-xl font-black py-4 rounded-2xl hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-lg shadow-indigo-600/20">
                                驗證解鎖查看
                            </button>
                        </form>
                    </div>
                </div>
            );

            // 支援顯示一般名單與「已繳費未登記」異常名單的大字體列表元件
            const renderTripList = (dataList) => (
                <div className="space-y-3.5 fade-in">
                    {dataList.length > 0 ? dataList.map((item, idx) => (
                        <div key={idx} className={`bg-white p-5 rounded-2xl shadow-sm border-2 flex flex-col gap-3 relative overflow-hidden transition-all hover:shadow-md ${item.isUnregistered ? 'border-amber-400 bg-amber-50/40' : 'border-slate-200'}`}>
                            <div className={`absolute left-0 top-0 bottom-0 w-2 ${item.isUnregistered ? 'bg-amber-500' : item.isPaid ? 'bg-emerald-500' : 'bg-rose-500'}`}></div>
                            <div className="flex items-center justify-between pl-3 gap-2 flex-wrap">
                                <div className="flex items-center gap-3.5">
                                    {item.id !== '-' ? (
                                        <div className="bg-slate-100 text-slate-800 font-mono-num font-black px-3.5 py-1.5 rounded-xl text-lg min-w-[3.2rem] text-center border-2 border-slate-200">
                                            {item.id}
                                        </div>
                                    ) : (
                                        <div className="bg-amber-100 text-amber-900 font-black px-3.5 py-1.5 rounded-xl text-base border-2 border-amber-300">
                                            未登記
                                        </div>
                                    )}
                                    <span className="text-2xl sm:text-3xl font-black text-slate-900 tracking-wide">{item.name}</span>
                                </div>
                                <div className={`px-4 py-2 rounded-xl flex items-center gap-2 border-2 text-base sm:text-lg font-black shadow-sm ${item.isUnregistered ? 'bg-amber-100 border-amber-300 text-amber-900' : item.isPaid ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-rose-50 border-rose-300 text-rose-700'}`}>
                                    {item.isUnregistered ? (
                                        <>
                                            <Icons.Alert className="w-5 h-5 text-amber-700" />
                                            <span>繳費異常</span>
                                        </>
                                    ) : item.isPaid ? (
                                        <>
                                            <Icons.Check />
                                            <span>已繳費</span>
                                        </>
                                    ) : (
                                        <>
                                            <span className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
                                            <span>未繳費</span>
                                        </>
                                    )}
                                </div>
                            </div>

                            {item.isUnregistered && (
                                <div className="pl-3 mt-1">
                                    <div className="text-base sm:text-lg font-black text-rose-800 bg-rose-50 border-2 border-rose-200 px-4 py-3 rounded-xl flex flex-wrap items-center justify-between gap-2">
                                        <span className="flex items-center gap-2">
                                            <Icons.Alert className="w-6 h-6 text-rose-600 flex-shrink-0" />
                                            已繳費，但登記名單內查無此人！
                                        </span>
                                        {item.paidAmount > 0 && (
                                            <span className="font-mono-num text-lg sm:text-xl font-black bg-white px-3 py-1 rounded-lg border-2 border-rose-300 text-rose-700">
                                                實繳 ${fmtMoney(item.paidAmount)}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )) : (
                        <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500 text-xl font-black">
                            查無符合條件之資料
                        </div>
                    )}
                </div>
            );

            // 祝壽頁面大字體渲染元件
            const renderBirthdayTab = (tabKey, themeKey, dataFiltered, dataStats) => {
                const themes = {
                    amber: {
                        panelBg: "bg-amber-50/80 border-amber-200",
                        bigActive: "bg-amber-600 text-white border-amber-700 shadow-md",
                        bigInactive: "bg-white text-amber-800 border-amber-300 hover:bg-amber-50",
                        totalBox: "bg-gradient-to-br from-amber-500 to-orange-600 text-white border-amber-600",
                        barBig: "bg-amber-500",
                        badgeBig: "text-amber-900 bg-amber-100 border-amber-300"
                    },
                    rose: {
                        panelBg: "bg-rose-50/80 border-rose-200",
                        bigActive: "bg-rose-600 text-white border-rose-700 shadow-md",
                        bigInactive: "bg-white text-rose-800 border-rose-300 hover:bg-rose-50",
                        totalBox: "bg-gradient-to-br from-rose-500 to-pink-600 text-white border-rose-600",
                        barBig: "bg-rose-500",
                        badgeBig: "text-rose-900 bg-rose-100 border-rose-300"
                    }
                };
                const t = themes[themeKey] || themes.amber;

                const showAllButton = (
                    <button
                        onClick={() => setBirthdayFilter('ALL')}
                        className={`text-base font-black px-5 py-2 rounded-full flex items-center gap-1.5 shadow-sm transition-all border-2 ${birthdayFilter === 'ALL' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}
                    >
                        顯示全部名單
                    </button>
                );

                return (
                    <div className="fade-in">
                        <TabUpdateDate tabKey={tabKey} leftContent={showAllButton} />
                        <ErrorBanner show={fetchErrors[tabKey]} />
                        
                        <div className={`${t.panelBg} rounded-2xl p-3.5 shadow-inner border-2 mb-5 grid grid-cols-2 sm:grid-cols-3 gap-3`}>
                            <button 
                                onClick={() => setBirthdayFilter('BIG')}
                                className={`flex flex-col items-center justify-center py-4 px-3 rounded-xl border-2 transition-all ${birthdayFilter === 'BIG' ? t.bigActive : t.bigInactive}`}
                            >
                                <span className="text-base sm:text-lg font-extrabold mb-1 whitespace-nowrap">大組組數</span>
                                <span className="text-3xl sm:text-4xl font-black font-mono-num">{dataStats.big}</span>
                            </button>
                            
                            <button 
                                onClick={() => setBirthdayFilter('SMALL')}
                                className={`flex flex-col items-center justify-center py-4 px-3 rounded-xl border-2 transition-all ${birthdayFilter === 'SMALL' ? 'bg-blue-600 text-white border-blue-700 shadow-md' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-50'}`}
                            >
                                <span className="text-base sm:text-lg font-extrabold mb-1 whitespace-nowrap">小組組數</span>
                                <span className="text-3xl sm:text-4xl font-black font-mono-num">{dataStats.small}</span>
                            </button>
                            
                            <div className={`col-span-2 sm:col-span-1 flex flex-col items-center justify-center py-4 px-3 rounded-xl border-2 shadow-md ${t.totalBox}`}>
                                <span className="text-base sm:text-lg font-extrabold mb-1 whitespace-nowrap">祝壽總金額</span>
                                <span className="text-3xl sm:text-4xl font-black font-mono-num">${fmtMoney(dataStats.totalAmount)}</span>
                            </div>
                        </div>

                        <div className="space-y-3.5">
                            {dataFiltered.length > 0 ? dataFiltered.map((item, idx) => {
                                const isBig = item.type.includes('大');
                                return (
                                    <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center relative overflow-hidden hover:shadow-md transition-all">
                                        <div className={`absolute left-0 top-0 bottom-0 w-2 ${isBig ? t.barBig : 'bg-blue-500'}`}></div>
                                        <div className="pl-3.5">
                                            <div className={`inline-flex items-center gap-1.5 text-base font-black px-3 py-1 rounded-lg mb-1.5 border-2 ${isBig ? t.badgeBig : 'text-blue-800 bg-blue-50 border-blue-200'}`}>
                                                <Icons.Star /> {item.type}
                                            </div>
                                            <div className="text-2xl sm:text-3xl font-black text-slate-900 tracking-wide">{item.name}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-2xl sm:text-3xl font-black text-emerald-600 font-mono-num">${fmtMoney(item.amount)}</div>
                                        </div>
                                    </div>
                                );
                            }) : <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500 text-xl font-black">查無資料</div>}
                        </div>
                    </div>
                );
            };

            const LightCard = ({ item }) => (
                <div className="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex flex-wrap items-center justify-between gap-3 relative overflow-hidden hover:shadow-md transition-all">
                    <div className={`absolute left-0 top-0 bottom-0 w-2 ${item.t === 1 ? 'bg-amber-400' : 'bg-indigo-500'}`}></div>
                    <div className="flex items-center gap-3.5 pl-3">
                        <div className={`px-3.5 py-1.5 rounded-xl font-mono-num font-black text-lg min-w-[3.8rem] text-center border-2 ${item.t === 1 ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-indigo-50 text-indigo-800 border-indigo-300'}`}>
                            {item.id}
                        </div>
                        <div className="flex items-center gap-2.5 flex-wrap">
                            <span className="text-2xl sm:text-3xl font-black text-slate-900">{item.n}</span>
                            <span className={`text-base font-black px-3 py-1 rounded-lg ${item.t === 1 ? 'bg-amber-100 text-amber-900' : 'bg-indigo-100 text-indigo-900'}`}>
                                {item.t === 1 ? '上層' : '下層'}
                            </span>
                        </div>
                    </div>
                    <div className="flex gap-2.5 text-base sm:text-lg ml-auto">
                        <div className={`px-3 py-1.5 rounded-xl flex items-center gap-1 font-black ${item.r ? 'text-emerald-700' : 'text-slate-400'}`}>{item.r ? '已登記' : '未登記'}</div>
                        <div className={`px-3.5 py-1.5 rounded-xl flex items-center gap-1.5 border-2 font-black ${item.p ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{item.p ? '已繳費' : '未繳費'}</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-16">
                    
                    {/* 專業級頂部導航與雙層標頭（內建「標準 / 大字」二段切換器） */}
                    <header className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 sticky top-0 z-50 shadow-xl border-b border-slate-800">
                        <div className="max-w-2xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="bg-indigo-500/20 border border-indigo-400/30 p-2 rounded-xl text-indigo-300 shadow-inner">
                                    <Icons.Ledger className="w-6 h-6" />
                                </div>
                                <h1 className="text-xl sm:text-2xl font-black text-white tracking-wider">
                                    帳務查詢系統
                                </h1>
                            </div>

                            {/* 右側工具列：字體大小二段切換（標準 / 大字） + 同步更新按鈕 */}
                            <div className="flex items-center gap-2 ml-auto flex-wrap">
                                <div className="bg-slate-800/95 p-1 rounded-xl border border-slate-700 flex items-center gap-1 shadow-inner" role="group" aria-label="字體大小切換">
                                    <span className="text-slate-400 pl-2 pr-1 hidden sm:inline-flex items-center" title="調整字體大小">
                                        <Icons.FontSize className="w-4 h-4" />
                                    </span>
                                    <button 
                                        type="button"
                                        onClick={() => handleFontChange('STANDARD', '標準字')}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-black transition-all whitespace-nowrap ${
                                            fontSizeMode === 'STANDARD' 
                                            ? 'bg-amber-400 text-slate-950 shadow-sm' 
                                            : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                                        }`}
                                    >
                                        標準
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={() => handleFontChange('LARGE', '大字')}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-black transition-all whitespace-nowrap ${
                                            fontSizeMode === 'LARGE' 
                                            ? 'bg-amber-400 text-slate-950 shadow-sm' 
                                            : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                                        }`}
                                    >
                                        大字
                                    </button>
                                </div>

                                <button 
                                    onClick={fetchGoogleSheetsData} disabled={isRefreshing}
                                    className="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm sm:text-base font-black px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-md disabled:opacity-50 border border-indigo-400 whitespace-nowrap"
                                >
                                    <Icons.Refresh className={isRefreshing ? "animate-spin text-white" : "text-white"} />
                                    <span>{isRefreshing ? '同步中' : '更新'}</span>
                                </button>
                            </div>
                        </div>
                        
                        {/* 膠囊式滑動分頁選單（字體隨模式自動縮放） */}
                        <div className="bg-slate-900/80 backdrop-blur border-t border-slate-800">
                            <div className="max-w-2xl mx-auto flex overflow-x-auto no-scrollbar py-2.5 px-3 gap-2 snap-x scroll-smooth">
                                {visibleTabsConfig.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button 
                                            key={tab.id} 
                                            onClick={() => { setActiveTab(tab.id); resetFilters(); }} 
                                            className={`flex-none px-5 py-3 rounded-xl text-lg sm:text-xl font-black transition-all whitespace-nowrap snap-start ${
                                                isActive 
                                                ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-950/50 ring-2 ring-indigo-300' 
                                                : 'text-slate-200 hover:text-white hover:bg-slate-800'
                                            }`}
                                        >
                                            {tab.name}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </header>

                    {/* 主內容容器 */}
                    <main className="max-w-2xl mx-auto px-4 mt-5">
                        
                        {/* 專業懸浮搜尋區塊 */}
                        <div className="relative mb-5 z-30" onClick={(e) => e.stopPropagation()}>
                            <div className="relative bg-white rounded-2xl shadow-md border-2 border-slate-300 focus-within:border-indigo-600 focus-within:ring-4 focus-within:ring-indigo-500/15 transition-all">
                                <input 
                                    type="text"
                                    className="w-full py-4 pl-14 pr-12 rounded-2xl bg-transparent focus:outline-none text-xl sm:text-2xl font-black text-slate-900 placeholder-slate-400"
                                    placeholder="輸入姓名、編號或項目搜尋..."
                                    value={searchTerm}
                                    onChange={(e) => {
                                        setSearchTerm(e.target.value); setShowSuggestions(true);
                                        setFilterRole("ALL"); setLightFilterType("ALL"); setTaiSuiFilterType("ALL");
                                        setEastTripFilter("ALL"); setFujianTripFilter("ALL"); setDonationFilterItem("ALL");
                                        setPuzhuoFilter("ALL_TOTAL"); setBirthdayFilter("ALL"); setExpandedDonationNames(new Set());
                                        setBuyinkuFilter("ALL"); setZhongyuanFilterItem("ALL"); setExpandedZhongyuanNames(new Set());
                                    }}
                                    onFocus={() => { if(searchTerm) setShowSuggestions(true); }}
                                />
                                <div className="absolute left-4 top-1/2 transform -translate-y-1/2 text-indigo-600"><Icons.Search /></div>
                                {searchTerm && (
                                    <button onClick={handleClear} className="absolute right-3.5 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1"><Icons.XCircle /></button>
                                )}
                            </div>
                            {showSuggestions && suggestions.length > 0 && (
                                <div className="absolute w-full bg-white mt-2 rounded-2xl shadow-2xl border-2 border-slate-200 overflow-hidden z-40">
                                    <div className="bg-slate-100 px-5 py-2.5 text-base text-slate-600 font-black border-b border-slate-200">相關建議名單（點擊直接帶入）</div>
                                    {suggestions.map((name, index) => (
                                        <button key={index} className="w-full text-left px-5 py-4 hover:bg-indigo-50 border-b border-slate-100 last:border-0 text-xl font-black text-slate-800 flex items-center justify-between" onClick={() => handleSelectSuggestion(name)}>
                                            <span>{name}</span>
                                            <span className="text-base text-indigo-600 font-extrabold">帶入搜尋 →</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        {visibleTabsConfig.length === 0 && (
                            <div className="bg-white rounded-2xl border-2 border-slate-200 flex flex-col items-center justify-center py-20 text-slate-500 shadow-sm">
                                <Icons.Alert className="w-10 h-10" />
                                <p className="mt-3 text-2xl font-black">目前無開放中的活動項目</p>
                            </div>
                        )}

                        {/* =======================================================
                            功能：零用金 (需要密碼 296296)
                        ======================================================= */}
                        {activeTab === 'pettyCash' && visibleTabs.pettyCash && (
                            <div className="fade-in">
                                <TabUpdateDate tabKey="pettyCash" />
                                {!isLoggedIn ? (
                                    renderPasswordLock("零用金帳務保護", "此頁面內容僅供授權財務人員檢視，請輸入密碼解鎖")
                                ) : (
                                    <>
                                        <ErrorBanner show={fetchErrors.pettyCash} />

                                        {/* 總餘額卡片 */}
                                        <div className="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white rounded-3xl p-6 shadow-xl mb-5 border border-slate-800 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 -mr-6 -mt-6 opacity-10">
                                                <Icons.Wallet className="w-40 h-40" />
                                            </div>
                                            <div className="relative z-10 flex flex-col gap-1.5">
                                                <div className="flex items-center gap-2 text-indigo-300 font-black text-base sm:text-lg tracking-wider">
                                                    <Icons.Wallet className="w-6 h-6" /> 零用金系統帳・總結餘
                                                </div>
                                                <div className="text-4xl sm:text-5xl font-black font-mono-num tracking-tight mt-1 mb-4 text-white">
                                                    ${fmtMoney(pettyCashStats.totalBalance)}
                                                </div>
                                                
                                                {/* --- 雲端手動輸入區塊 --- */}
                                                <div className="border-t border-slate-700 pt-4 mt-1">
                                                    <div className="text-slate-200 font-black text-base sm:text-lg mb-3 flex items-center justify-between">
                                                        <span>手動盤點在手零用金</span>
                                                        <span className="text-sm text-indigo-300">雲端同步紀錄</span>
                                                    </div>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-4">
                                                        <div>
                                                            <label className="text-base text-slate-200 mb-1.5 block font-bold">宮池_零用金</label>
                                                            <input
                                                                type="number"
                                                                value={actualCash1}
                                                                onChange={handleCash1Change}
                                                                className="w-full bg-slate-800/90 border-2 border-slate-600 rounded-xl p-3 text-white font-mono-num placeholder-slate-500 focus:outline-none focus:border-indigo-400 transition-colors text-2xl font-black"
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="text-base text-slate-200 mb-1.5 block font-bold">總務_保管金</label>
                                                            <input
                                                                type="number"
                                                                value={actualCash2}
                                                                onChange={handleCash2Change}
                                                                className="w-full bg-slate-800/90 border-2 border-slate-600 rounded-xl p-3 text-white font-mono-num placeholder-slate-500 focus:outline-none focus:border-indigo-400 transition-colors text-2xl font-black"
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center justify-between bg-slate-800/90 rounded-xl px-4 py-3 border-2 border-slate-700 mb-4">

                                </div>
                            </div>

                        {/* =======================================================

                                        <div className="flex items-center gap-1.5 mb-1">

                                        <div className="text-3xl sm:text-4xl font-black font-mono-num flex items-center gap-2">
                                            {buyinkuStats.anomalyTotal > 0 && buyinkuFilter !== 'ANOMALY' && <span className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>}

                                    {buyinkuFiltered.length > 0 ? buyinkuFiltered.map((item, idx) => (

                        {/* =======================================================

                        {/* =======================================================

                                        return (
                                            <div key={idx} className={`bg-white p-5 rounded-2xl shadow-sm border-2 flex flex-col gap-2.5 relative overflow-hidden hover:shadow-md transition-all ${isAnomaly ? 'border-amber-400 bg-amber-50/40' : 'border-slate-200'}`}>

                                                    <div className="flex items-center gap-3">

                                                    </div>
                                                    <div className={`px-4 py-1.5 rounded-xl text-base sm:text-lg font-black flex items-center gap-2 border-2 ${item.isPaid ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-rose-50 border-rose-300 text-rose-700'}`}>

                                                </div>

                                                    {!item.isUnregistered && (
                                                        <div className="text-base sm:text-lg font-extrabold text-slate-700 flex items-center gap-2.5 flex-wrap">
                                                            <span>房型：</span>
                                                            <span className="bg-sky-50 text-sky-800 px-3 py-1 rounded-lg border-2 border-sky-200 font-black">{item.roomType || '未指定'}</span>
                                                            <span className="text-slate-600 font-mono-num font-black">(應繳 ${fmtMoney(expected)})</span>

                                                    {isAnomaly && (
                                                        <div className="mt-2.5 text-base sm:text-lg font-black text-rose-800 bg-rose-50 border-2 border-rose-200 px-4 py-2.5 rounded-xl flex flex-col gap-1">
