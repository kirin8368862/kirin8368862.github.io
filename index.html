<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳務查詢系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        
        /* 載入動畫 */
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 隱藏捲軸但保留捲動功能 (給頂部導航列使用) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;

        // =========================================================================
        // [正式啟動] Google Sheets CSV 自動抓取網址區
        // =========================================================================
        const GOOGLE_SHEETS_URLS = {
            puzhuo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=385503720&single=true&output=csv",
            taiSui: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1409111845&single=true&output=csv",        
            lightUpper: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1353370878&single=true&output=csv",    
            lightLower: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1743080288&single=true&output=csv",    
            records: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=0&single=true&output=csv",
            eastTrip: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=43391721", 
            fujianTrip: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=691088006",
            donation: "https://docs.google.com/spreadsheets/d/1tyVkgPvtkvnFIoj2Y16a-Z85EXMojL8BUM7KntPzCzU/gviz/tq?tqx=out:csv&gid=935792502",
            member: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1548605444&single=true&output=csv", 
            guansheng: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1292456593&single=true&output=csv",
            wangmu: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOWEAQJcMTntV41OxbT77OrZep_yugyF5yrJBxV8NjT3pzxDG3DCvNzOuWy74CB_tT4rOR65vofzv-/pub?gid=1713222138&single=true&output=csv"
        };

        const fmtMoney = (num) => new Intl.NumberFormat('zh-TW').format(num);

        const splitCSVRow = (str) => {
            let row = [''], i = 0, inQuotes = false;
            for (let char of str) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) row[++i] = '';
                else row[i] += char;
            }
            return row.map(v => v.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
        };

        const extractPuzhuo = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            
            const paidSet = new Set();
            parsed.forEach(row => {
                const payer = row['_col_4'];
                if(payer && payer.trim() !== '' && !payer.includes('姓名')) {
                    paidSet.add(payer.trim());
                }
            });

            return parsed.map((row, i) => {
                const id = (row['_col_0'] || '').trim();
                const name1 = (row['_col_1'] || '').trim();
                const name2 = (row['_col_2'] || '').trim();
                const memo = (row['_col_3'] || '').trim();

                const isPaid = (name1 && paidSet.has(name1)) || (name2 && paidSet.has(name2));
                const isDeceased = i >= 149; 

                return {
                    id, name1, name2, memo, isPaid, isDeceased,
                    valid: (id !== '' || name1 !== '' || name2 !== '')
                };
            }).filter(r => r.valid && (r.name1 || r.name2));
        };

        const extractTripData = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let idKey = keys.find(k => k.includes('序號') || k.includes('編號')) || keys[0];
            let regKey = keys.find(k => k.includes('登記') || k.includes('姓名')) || keys[1]; 
            let paidKey = keys.find(k => k.includes('繳費')) || keys[4]; 
            if(!regKey) return [];

            let paidSet = new Set();
            parsed.forEach(row => {
                const pName = row[paidKey];
                if(pName && pName.trim() !== '') paidSet.add(pName.trim());
            });

            return parsed.filter(row => row[regKey] && row[regKey].trim() !== '').map((row, i) => ({
                id: (row[idKey] || '').trim() || (i + 1),
                name: row[regKey].trim(), 
                isPaid: paidSet.has(row[regKey].trim())
            }));
        };

        const extractDonations = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let itemKey = keys.find(k => k.includes('項目')) || keys[0];
            let nameKey = keys.find(k => k.includes('姓名') || k.includes('名單')) || keys[1];
            let amountKey = keys.find(k => k.includes('金額') || k.includes('元')) || keys[2];

            return parsed.map((row, i) => {
                const cleanAmount = parseInt((row[amountKey] || '0').replace(/,/g, '').replace(/\$/g, ''), 10) || 0;
                return {
                    id: i,
                    item: (row[itemKey] || '').trim(),
                    name: (row[nameKey] || '').trim(),
                    amount: cleanAmount
                };
            }).filter(r => r.name || r.amount > 0);
        };

        const extractMember = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let nameKey = keys.find(k => k.includes('姓名') || k.includes('名單')) || keys[1];
            return parsed.map((row, i) => ({
                id: (row[keys[0]] || i + 1).toString().trim(),
                name: (row[nameKey] || '').trim()
            })).filter(r => r.name);
        };

        const extractBirthday = (parsed) => {
            if(!parsed || parsed.length === 0) return [];
            const keys = Object.keys(parsed[0]);
            let nameKey = keys.find(k => k.includes('姓名')) || keys[0];
            let sizeKey = keys.find(k => k.includes('大小') || k.includes('組')) || keys[1];
            let amountKey = keys.find(k => k.includes('金額')) || keys[2];

            return parsed.map((row, i) => {
                const cleanAmount = parseInt((row[amountKey] || '0').replace(/,/g, '').replace(/\$/g, ''), 10) || 0;
                return {
                    id: i,
                    name: (row[nameKey] || '').trim(),
                    type: (row[sizeKey] || '').trim(),
                    amount: cleanAmount
                };
            }).filter(r => r.name);
        };

        const sortById = (a, b) => {
            if (!a.id || !b.id) return 0;
            const firstA = String(a.id)[0];
            const firstB = String(b.id)[0];
            if (firstA !== firstB) return firstA.localeCompare(firstB);
            const secondA = String(a.id)[1];
            const secondB = String(b.id)[1];
            if (secondA !== secondB) return secondA.localeCompare(secondB);
            const restA = parseInt(String(a.id).slice(2), 10);
            const restB = parseInt(String(b.id).slice(2), 10);
            return restA - restB;
        };

        // 預設測試資料區塊
        const DEFAULT_PUZHUO_DATA = [{ id: "1", name1: "測試資料", name2: "", memo: "", isPaid: false, isDeceased: false }];
        const DEFAULT_RECORD_DATA = [ { group: "1", role: "宮生", name: "傅沛柔", date: "114年12月" } ];
        const DEFAULT_TAISUI_DATA = [{id:"1A1",n:"黃淑霞",r:1,p:1}];
        const DEFAULT_LIGHT_DATA = [{id:"1B10",n:"游宇閎",t:1,r:1,p:1}];
        const DEFAULT_TRIP_DATA = [ { id: 1, name: "測試資料", isPaid: true } ];
        const DEFAULT_DONATION_DATA = [{ id: 1, item: "白米", name: "測試善人", amount: 500 }];
        const DEFAULT_MEMBER_DATA = [{ id: 1, name: "測試會員" }];
        const DEFAULT_BIRTHDAY_DATA = [{ id: 1, name: "測試信眾", type: "大組", amount: 1200 }];

        const Icons = {
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-7 h-7"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-emerald-600"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Scroll: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Refresh: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-4 h-4 ${className}`}><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 1 0 2.13-5.83L2 8"></path></svg>,
            Gift: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        };

        const TABS_CONFIG = [
            { id: 'puzhuo', name: '中元普桌' },
            { id: 'donation', name: '宮慶捐獻' },
            { id: 'guansheng', name: '關聖帝君祝壽' },
            { id: 'wangmu', name: '王母娘娘祝壽' },
            { id: 'member', name: '帝君會員' },
            { id: 'east', name: '東部參香' },
            { id: 'fujian', name: '小琉球二日行' },
            { id: 'records', name: '委員/宮生' },
            { id: 'taisui', name: '安太歲' },
            { id: 'light', name: '光明燈' }
        ];

        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);
            
            // 狀態：管理各分頁的隱藏/顯示
            const [visibleTabs, setVisibleTabs] = useState({
                puzhuo: true, records: true, taisui: true, light: true, east: true, 
                fujian: true, donation: true, member: true, guansheng: true, wangmu: true
            });

            const [updateDates, setUpdateDates] = useState({
                puzhuo: "", records: "", taisui: "", light: "", east: "", fujian: "", 
                donation: "", member: "", guansheng: "", wangmu: ""
            });
            
            const [PuzhuoDataRaw, setPuzhuoDataRaw] = useState([]);
            const [RecordData, setRecordData] = useState([]);
            const [TaiSuiDataRaw, setTaiSuiDataRaw] = useState([]);
            const [LightDataRaw, setLightDataRaw] = useState([]);
            const [EastTripDataRaw, setEastTripDataRaw] = useState([]);
            const [FujianTripDataRaw, setFujianTripDataRaw] = useState([]);
            const [DonationDataRaw, setDonationDataRaw] = useState([]);
            const [MemberDataRaw, setMemberDataRaw] = useState([]);
            const [GuanshengDataRaw, setGuanshengDataRaw] = useState([]);
            const [WangmuDataRaw, setWangmuDataRaw] = useState([]);

            const [fetchErrors, setFetchErrors] = useState({ 
                puzhuo: false, east: false, fujian: false, donation: false, member: false, guansheng: false, wangmu: false 
            });

            const [activeTab, setActiveTab] = useState("puzhuo"); 
            const [searchTerm, setSearchTerm] = useState("");
            const [showSuggestions, setShowSuggestions] = useState(false);
            
            // 各頁面 Filter States
            const [puzhuoFilter, setPuzhuoFilter] = useState("ALL");
            const [filterRole, setFilterRole] = useState("ALL"); 
            const [lightFilterType, setLightFilterType] = useState("ALL");
            const [taiSuiFilterType, setTaiSuiFilterType] = useState("ALL");
            const [eastTripFilter, setEastTripFilter] = useState("ALL");
            const [fujianTripFilter, setFujianTripFilter] = useState("ALL");
            const [donationFilterItem, setDonationFilterItem] = useState("ALL");
            const [donationViewMode, setDonationViewMode] = useState("ITEM"); 
            const [birthdayFilter, setBirthdayFilter] = useState("ALL"); // 新增祝壽頁面篩選狀態
            
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [inputPassword, setInputPassword] = useState("");
            const [loginError, setLoginError] = useState(false);

            const checkStatus = (row, ...keywords) => {
                let val = "";
                for (let k of keywords) {
                    if (row[k] !== undefined && row[k] !== '') { val = String(row[k]).trim(); break; }
                }
                if (!val) {
                    const rowKeys = Object.keys(row);
                    for (let key of rowKeys) {
                        for (let k of keywords) {
                            if (key.includes(k) && row[key] !== undefined && row[key] !== '') { val = String(row[key]).trim(); break; }
                        }
                        if (val) break;
                    }
                }
                if (!val) return 0;
                const upperVal = val.toUpperCase();
                if (upperVal === '0' || upperVal === 'FALSE' || upperVal === '否' || upperVal === '無') return 0;
                return 1; 
            };

            const fetchGoogleSheetsData = useCallback(async () => {
                setIsRefreshing(true);
                const getFreshUrl = (url) => `${url}&t=${new Date().getTime()}`;
                const fetchOptions = { cache: 'no-store' };

                const fetchData = async (url, parser) => {
                    if (!url) return { data: [], date: "", error: false, isHidden: false };
                    try {
                        const res = await fetch(getFreshUrl(url), fetchOptions);
                        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                        const text = await res.text();
                        
                        if (text.trim().toLowerCase().startsWith('<!doctype html>')) {
                             return { data: [], date: "", error: true, isHidden: false };
                        }

                        const cleanText = text.replace(/^\uFEFF/, '');
                        const lines = cleanText.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                        if (lines.length === 0) return { data: [], date: "", error: false, isHidden: false };

                        const headersRaw = splitCSVRow(lines[0]);
                        let extractedDate = "";
                        const isHidden = headersRaw.length > 7 && headersRaw[7].includes('隱藏');

                        if (headersRaw.length > 5 && headersRaw[5].includes('更新')) {
                            extractedDate = headersRaw[5].replace(/更新日?[:：\s]?/g, '').trim();
                        } else {
                            const found = headersRaw.find(h => h.includes('更新日'));
                            if (found) extractedDate = found.replace(/更新日?[:：\s]?/g, '').trim();
                        }

                        const parsed = lines.slice(1).map(line => {
                            const values = splitCSVRow(line);
                            return headersRaw.reduce((obj, header, i) => {
                                const cleanHeader = header.replace(/["'\s]+/g, '');
                                obj[cleanHeader] = values[i] || '';
                                obj[`_col_${i}`] = values[i] || ''; // 確保可依欄位索引取值
                                return obj;
                            }, {});
                        });

                        return { data: parser ? parser(parsed) : parsed, date: extractedDate, error: false, isHidden };
                    } catch (e) {
                        return { data: [], date: "", error: true, isHidden: false };
                    }
                };

                const resPuzhuo = await fetchData(GOOGLE_SHEETS_URLS.puzhuo, extractPuzhuo);

                const resRecord = await fetchData(GOOGLE_SHEETS_URLS.records, parsed => parsed.map(row => ({
                    group: row['組別'] || '', role: row['身份'] || '', name: row['姓名'] || '', date: row['繳交至'] || ''
                })).filter(r => r.name));

                const resTaiSui = await fetchData(GOOGLE_SHEETS_URLS.taiSui, parsed => parsed.map(row => ({
                    id: row['編號'] || '', n: row['姓名'] || '', 
                    r: checkStatus(row, '太歲登記', '登記', '安奉', '太歲'), 
                    p: checkStatus(row, '太歲繳費', '繳費', '付款', '金額')
                })).filter(r => r.n));

                const resLightUpper = await fetchData(GOOGLE_SHEETS_URLS.lightUpper, parsed => parsed.map(row => ({
                    id: row['編號'] || '', n: row['姓名'] || '', t: 1,
                    r: checkStatus(row, '光明燈上登記', '上層登記', '登記', '安奉', '光明燈'), 
                    p: checkStatus(row, '光明燈上繳費', '上層繳費', '繳費', '付款', '金額')
                })).filter(r => r.n));
                
                const resLightLower = await fetchData(GOOGLE_SHEETS_URLS.lightLower, parsed => parsed.map(row => ({
                    id: row['編號'] || '', n: row['姓名'] || '', t: 2,
                    r: checkStatus(row, '光明燈下登記', '下層登記', '登記', '安奉', '光明燈'), 
                    p: checkStatus(row, '光明燈下繳費', '下層繳費', '繳費', '付款', '金額')
                })).filter(r => r.n));

                const resEast = await fetchData(GOOGLE_SHEETS_URLS.eastTrip, extractTripData);

                                                            <div className={`text-xl font-bold flex items-center justify-end gap-1 ${item.date === '未繳交' || item.date === '未繳費' ? 'text-red-600' : item.date.includes('113') ? 'text-orange-600' : 'text-emerald-600'}`}>
                                                                {item.date}
                                                                {(item.date === '未繳交' || item.date === '未繳費') && <span className="flex h-3 w-3 relative ml-1"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )) : <div className="text-center py-12 text-slate-500 text-xl font-bold">查無資料</div>}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* 功能：安太歲 */}
                        {activeTab === 'taisui' && visibleTabs.taisui && (
                            <div className="fade-in">
                                <TabUpdateDate tabKey="taisui" />
                                <div className="bg-rose-50 rounded-xl p-3 shadow-inner border border-rose-100 mb-4 flex justify-between gap-2 overflow-x-auto">
                                    <button onClick={() => setTaiSuiFilterType('ALL')} className={`flex-1 flex flex-col items-center justify-center py-3 px-2 rounded-lg border ${taiSuiFilterType === 'ALL' ? 'bg-rose-600 text-white border-rose-600 shadow-md' : 'bg-white text-rose-500 border-rose-100'}`}>
                                        <span className="text-base font-bold opacity-90 mb-1 whitespace-nowrap">登記總數</span><span className="text-3xl font-black">{taiSuiStats.reg}</span>
                                    </button>
                                    <button onClick={() => setTaiSuiFilterType('PAID')} className={`flex-1 flex flex-col items-center justify-center py-3 px-2 rounded-lg border ${taiSuiFilterType === 'PAID' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-100'}`}>
                                        <span className="text-base font-bold opacity-90 mb-1 whitespace-nowrap">已繳費</span><span className="text-3xl font-black">{taiSuiStats.paid}</span>
                                    </button>
                                    <button onClick={() => setTaiSuiFilterType('UNPAID')} className={`flex-1 flex flex-col items-center justify-center py-3 px-2 rounded-lg border ${taiSuiFilterType === 'UNPAID' ? 'bg-red-600 text-white border-red-600 shadow-md' : 'bg-white text-red-600 border-red-100'}`}>
                                        <span className="text-base font-bold opacity-90 mb-1 whitespace-nowrap">未繳費</span><span className="text-3xl font-black">{taiSuiStats.unpaid}</span>
                                    </button>
                                </div>
                                <div className="space-y-2 fade-in">
                                    {taiSuiDisplay.length > 0 ? taiSuiDisplay.map((item, idx) => (
                                        <div key={idx} className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                {item.id ? <div className="bg-rose-100 px-2 py-1 rounded text-rose-600 font-bold text-sm min-w-[3rem] text-center">{item.id}</div> : <div className="bg-rose-100 p-2 rounded-full text-rose-600"><Icons.Scroll /></div>}
                                                <span className="text-xl font-bold text-slate-800">{item.n}</span>
                                            </div>
                                            <div className="flex gap-2 text-sm">
                                                <div className={`px-3 py-1 rounded-md flex items-center gap-1 border ${item.r ? 'bg-green-50 border-green-200 text-green-700' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                                    {item.r ? <Icons.Check /> : <span className="w-4 h-4 block border border-slate-300 rounded-sm"></span>}<span className="font-bold">登記</span>
                                                </div>
                                                <div className={`px-3 py-1 rounded-md flex items-center gap-1 border ${item.p ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                                    {item.p ? <Icons.Check /> : <span className="w-4 h-4 block border border-slate-300 rounded-sm"></span>}<span className="font-bold">繳費</span>
                                                </div>
                                            </div>
                                        </div>
                                    )) : <div className="text-center py-8 text-slate-500">查無資料</div>}
                                </div>
                            </div>
                        )}

                        {/* 功能：光明燈 */}
                        {activeTab === 'light' && visibleTabs.light && (
                            <div className="fade-in">
                                <TabUpdateDate tabKey="light" />
                                <div className="bg-amber-50 rounded-xl p-3 shadow-inner border border-amber-100 mb-4 flex justify-between gap-2 overflow-x-auto min-w-full no-scrollbar">
                                    <button onClick={() => setLightFilterType('ALL')} className={`flex-shrink-0 w-24 flex flex-col items-center justify-center py-3 px-1 rounded-lg border ${lightFilterType === 'ALL' ? 'bg-amber-600 text-white border-amber-600 shadow-md' : 'bg-white text-slate-500 border-amber-100'}`}>
                                        <span className="text-sm font-bold opacity-90 mb-1 whitespace-nowrap">登記總數</span><span className="text-2xl font-black">{lightStats.totalReg}</span>
                                    </button>
                                    <button onClick={() => setLightFilterType('UPPER')} className={`flex-shrink-0 w-24 flex flex-col items-center justify-center py-3 px-1 rounded-lg border ${lightFilterType === 'UPPER' ? 'bg-amber-500 text-white border-amber-500 shadow-md' : 'bg-white text-amber-700 border-amber-100'}`}>
                                        <span className="text-sm font-bold opacity-90 mb-1 whitespace-nowrap">上層登記</span><span className="text-2xl font-black">{lightStats.upperReg}</span>
                                    </button>
                                    <button onClick={() => setLightFilterType('LOWER')} className={`flex-shrink-0 w-24 flex flex-col items-center justify-center py-3 px-1 rounded-lg border ${lightFilterType === 'LOWER' ? 'bg-indigo-500 text-white border-indigo-500 shadow-md' : 'bg-white text-indigo-700 border-indigo-100'}`}>
                                        <span className="text-sm font-bold opacity-90 mb-1 whitespace-nowrap">下層登記</span><span className="text-2xl font-black">{lightStats.lowerReg}</span>
                                    </button>
                                    <button onClick={() => setLightFilterType('PAID')} className={`flex-shrink-0 w-24 flex flex-col items-center justify-center py-3 px-1 rounded-lg border ${lightFilterType === 'PAID' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-100'}`}>
                                        <span className="text-sm font-bold opacity-90 mb-1 whitespace-nowrap">已繳費</span><span className="text-2xl font-black">{lightStats.paid}</span>
                                    </button>
                                    <button onClick={() => setLightFilterType('UNPAID')} className={`flex-shrink-0 w-24 flex flex-col items-center justify-center py-3 px-1 rounded-lg border ${lightFilterType === 'UNPAID' ? 'bg-red-600 text-white border-red-600 shadow-md' : 'bg-white text-red-600 border-red-100'}`}>
                                        <span className="text-sm font-bold opacity-90 mb-1 whitespace-nowrap">未繳費</span><span className="text-2xl font-black">{lightStats.unpaid}</span>
                                    </button>
                                </div>
                                <div className="space-y-2 fade-in">
                                    {lightDisplay.length > 0 ? lightDisplay.map((item, idx) => <LightCard key={idx} item={item} />) : <div className="text-center py-8 text-slate-500">查無資料</div>}
                                </div>
                            </div>
                        )}

                        {/* 功能：帝君會員 */}
                        {activeTab === 'member' && visibleTabs.member && (
                            <div className="fade-in">
                                <TabUpdateDate tabKey="member" />
                                <ErrorBanner show={fetchErrors.member} />
                                <div className="bg-amber-50 rounded-xl p-4 shadow-inner border border-amber-100 mb-4 flex justify-between items-center">
                                    <div className="flex items-center gap-2 text-amber-700 font-bold"><Icons.Users /> 統計人數</div>
                                    <div className="text-4xl font-black text-amber-600">{memberFiltered.length} <span className="text-base font-bold text-amber-600 opacity-70">人</span></div>
                                </div>
                                <div className="space-y-2 fade-in">
                                    {memberFiltered.length > 0 ? memberFiltered.map((item, idx) => (
                                        <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                                            <div className="bg-amber-100 text-amber-700 font-bold px-3 py-1 rounded-md text-sm min-w-[3rem] text-center shadow-sm">
                                                {item.id}
                                            </div>
                                            <span className="text-xl font-bold text-slate-800 tracking-wide">{item.name}</span>
                                        </div>
                                    )) : <div className="text-center py-8 text-slate-500">查無資料</div>}
                                </div>
                            </div>
                        )}

                        {/* 新增：關聖帝君祝壽 */}
                        {activeTab === 'guansheng' && visibleTabs.guansheng && renderBirthdayTab('guansheng', 'red', guanshengFiltered, guanshengStats)}

                        {/* 新增：王母娘娘祝壽 */}
                        {activeTab === 'wangmu' && visibleTabs.wangmu && renderBirthdayTab('wangmu', 'rose', wangmuFiltered, wangmuStats)}

                    </div>
                </div>
            );
        }

        if (typeof ReactDOM === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="text-align:center; padding:2rem; color:red; font-weight:bold;">無法載入 React 函式庫，請檢查網路狀態。</div>';
        } else {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
