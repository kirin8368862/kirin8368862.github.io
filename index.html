                                                                <div className="flex items-center gap-2"><Icons.Alert className="w-6 h-6 text-rose-600 flex-shrink-0" /> 有繳費紀錄，但未在登記名單中！(已繳 ${fmtMoney(item.paidAmount)})</div>
                                                            ) : (
                                                                <div className="flex items-center gap-2"><Icons.Alert className="w-6 h-6 text-rose-600 flex-shrink-0" /> 繳費金額不符！(應繳 ${fmtMoney(expected)}，實繳 ${fmtMoney(item.paidAmount)})</div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )
                                    }) : <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500 text-xl font-black">查無資料</div>}
                                </div>
                            </div>
                        )}

                        {/* =======================================================
                            功能：帝君會員
                        ======================================================= */}
                        {activeTab === 'member' && visibleTabs.member && (
                            <div className="fade-in">
                                <TabUpdateDate tabKey="member" />
                                <ErrorBanner show={fetchErrors.member} />
                                <div className="bg-gradient-to-r from-indigo-600 to-slate-800 text-white rounded-2xl p-5 shadow-md mb-5 flex justify-between items-center">
                                    <div className="font-black flex items-center gap-2.5 text-lg sm:text-xl"><Icons.Users className="w-6 h-6 text-indigo-200" />帝君會員總人數</div>
                                    <div className="text-3xl sm:text-4xl font-black font-mono-num">{memberFiltered.length} <span className="text-lg opacity-85">人</span></div>
                                </div>
                                <div className="space-y-3.5">
                                    {memberFiltered.length > 0 ? memberFiltered.map((item, idx) => (
                                        <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex items-center relative overflow-hidden hover:shadow-md transition-all">
                                            <div className="absolute left-0 top-0 bottom-0 w-2 bg-indigo-500"></div>
                                            <div className="flex items-center gap-4 pl-3.5">
                                                <div className="bg-indigo-50 text-indigo-800 font-mono-num font-black text-xl px-4 py-1.5 rounded-xl min-w-[4rem] text-center border-2 border-indigo-200">
                                                    {item.id}
                                                </div>
                                                <div className="text-2xl sm:text-3xl font-black text-slate-900 tracking-wider">{item.name}</div>
                                            </div>
                                        </div>
                                    )) : <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500 text-xl font-black">查無資料</div>}
                                </div>
                            </div>
                        )}

                        {/* =======================================================
                            功能：關聖帝君祝壽
                        ======================================================= */}
                        {activeTab === 'guansheng' && visibleTabs.guansheng && renderBirthdayTab("guansheng", "amber", guanshengFiltered, guanshengStats)}

                        {/* =======================================================
                            功能：王母娘娘祝壽
                        ======================================================= */}
                        {activeTab === 'wangmu' && visibleTabs.wangmu && renderBirthdayTab("wangmu", "rose", wangmuFiltered, wangmuStats)}

                    </main>

                    {/* Toast Notification */}
                    {toastMsg && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 backdrop-blur text-white px-6 py-4 rounded-2xl shadow-2xl z-[100] fade-in flex items-center gap-2.5 text-lg font-black border-2 border-slate-700 whitespace-nowrap">
                            {toastMsg}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
